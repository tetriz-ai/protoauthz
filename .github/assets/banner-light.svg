<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="protoauthz: each gRPC method declares its access level in the proto file, and an interceptor enforces it">
  <rect width="880" height="200" rx="16" fill="#F2F4F7"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="48" y="52" fill="#5B6675">rpc DeleteNote(…) { option (protoauthz.v1.auth_level) = <tspan fill="#16263A">AUTH_LEVEL_ADMIN</tspan>; }</text>
    <text x="48" y="80" fill="#5B6675">member: <tspan fill="#B42318">PermissionDenied</tspan><tspan x="330">admin: </tspan><tspan fill="#2F6FEB">OK</tspan></text>
  </g>
  <text x="48" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#16263A">protoauthz</text>
  <text x="48" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#2B3B50">Each gRPC method declares its access level in its proto file, and an interceptor enforces it.</text>
</svg>
