<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="protoauthz: each gRPC method declares its access level in the proto file, and an interceptor enforces it">
  <rect width="880" height="200" rx="16" fill="#141B26"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="48" y="52" fill="#8B97A8">rpc DeleteNote(…) { option (protoauthz.v1.auth_level) = <tspan fill="#EEF2F7">AUTH_LEVEL_ADMIN</tspan>; }</text>
    <text x="48" y="80" fill="#8B97A8">member: <tspan fill="#FF8A80">PermissionDenied</tspan><tspan x="330">admin: </tspan><tspan fill="#5B93FF">OK</tspan></text>
  </g>
  <text x="48" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#EEF2F7">protoauthz</text>
  <text x="48" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#C3CCD8">Each gRPC method declares its access level in its proto file, and an interceptor enforces it.</text>
</svg>
